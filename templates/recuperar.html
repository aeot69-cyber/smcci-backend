<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMCCI - Recuperar Contraseña</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f6fb}</style></head>
<body class="bg-light"><div class="container mt-5"><div class="row justify-content-center"><div class="col-md-5">
<div class="card p-4 shadow">
<h4 class="text-center">🔑 Recuperar Contraseña</h4>
<p class="text-muted text-center">Ingrese su nombre de usuario. Se generará una contraseña temporal.</p>
{% for cat,msg in get_flashed_messages(with_categories=true) %}
<div class="alert alert-{{'success' if cat=='ok' else 'danger'}}">{{msg}}</div>
{% endfor %}
<form method="post" action="/recuperar">
<div class="mb-3">
<label class="form-label">Usuario</label>
<input class="form-control" name="username" placeholder="Nombre de usuario" required>
</div>
<button class="btn btn-primary w-100">Generar Contraseña Temporal</button>
</form>
<hr>
<a href="/login" class="btn btn-secondary w-100">← Volver al Login</a>
</div>
</div></div></div></body></html>
