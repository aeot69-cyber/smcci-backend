<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMCCI · Informe de Célula</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f6fb;min-height:100vh}.campo-trampa{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}</style></head>
<body>
<div class="container" style="max-width:560px">
{% with _msgs = get_flashed_messages(with_categories=true) %}
{% if _msgs %}{% for cat,msg in _msgs %}<div class="alert alert-{{'success' if cat=='ok' else 'danger'}} alert-dismissible fade show mt-3 mb-0" role="alert">{{msg}}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endif %}
{% endwith %}
{% block b %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
