{% extends "base.html" %}{% block b %}<h2>Asignar discípulo</h2>
<form method="post">Hermano: <select name="hermano">{% for h in hermanos %}<option value="{{h.id}}">{{h.nombre_completo}}</option>{% endfor %}</select><br>
Líder: <select name="lider">{% for l in lideres %}<option value="{{l.id}}">{{l.nombre_completo}}</option>{% endfor %}</select><br>
Periodicidad: <select name="per"><option value="">--</option>{% for p in per %}<option value="{{p.id}}">{{p.nombre}}</option>{% endfor %}</select><br>
<label><input type="checkbox" name="activo" checked> Discípulo activo</label><br>Obs: <input name="obs"><br><button>Guardar</button></form>{% endblock %}
