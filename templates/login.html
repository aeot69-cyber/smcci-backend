<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMCCI Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><style>.pw-toggle{position:relative}.pw-toggle input{padding-right:2.5rem}.pw-toggle .toggle-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#6c757d;font-size:1.1rem}</style></head>
<body class="bg-light"><div class="container mt-5"><div class="row justify-content-center"><div class="col-md-4"><div class="card p-4 text-center shadow"><h3>⛪ SMCCI</h3><p class="text-muted">Ingreso al sistema</p>
{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{'success' if cat=='ok' else 'danger'}} alert-dismissible fade show" role="alert">{{msg}}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}
<form method="post" action="/login"><input class="form-control mb-2" name="username" placeholder="Usuario" required><div class="pw-toggle mb-2"><input class="form-control" type="password" name="password" id="pwd-login" placeholder="Clave" required><i class="bi bi-eye toggle-icon" onclick="togglePwd('pwd-login',this)"></i></div><button class="btn btn-primary w-100 mb-2">Entrar</button></form>
<a href="/recuperar" class="text-decoration-none">¿Olvidó su contraseña?</a>
</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>function togglePwd(id,icon){const inp=document.getElementById(id);if(inp.type==='password'){inp.type='text';icon.className='bi bi-eye-slash toggle-icon'}else{inp.type='password';icon.className='bi bi-eye toggle-icon'}}</script>
</body></html>
